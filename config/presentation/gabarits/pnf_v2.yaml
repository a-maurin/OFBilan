# ========================================================================================
# GABARIT DE PRESENTATION : PARC NATIONAL DE FORETS V2 (`pnf_v2.yaml`)
# ========================================================================================
#
# RÔLE : Gabarit de PRÉSENTATION uniquement (mise en page, ordre des sections, titres visuels).
# → Ce fichier ne contient AUCUNE logique métier (filtres, sources de données, périmètre géo).
# → Pour la logique métier (restrict_geo, analyses, sources...), voir :
#   config/profils_bilan/pnf_v2.yaml
#
# Relation Profil / Gabarit :
#   - Le PROFIL définit QUOI analyser : périmètre géo, sources, agrégations, options métier.
#   - Le GABARIT définit COMMENT présenter : grille de pages, widgets, ordre des chapitres.
#   - Ce gabarit est compatible avec les profils `pnf` et `pnf_v2` (voir `profils_compatibles`).
#
# Note : La clé `options.tub: false` présente dans ce fichier est une exception temporaire
# (logique métier tolérée ici car liée à la présentation des tableaux TUB). Elle devrait
# à terme migrer vers config/profils_bilan/pnf_v2.yaml.
#
# Contenu du gabarit :
#   - Synthèse globale AOA avec chiffres clés, cartes et graphiques complets.
#   - Focus dédié au Cœur de parc.
#   - Déclinaisons départementales (21 - Côte-d'Or & 52 - Haute-Marne).
#   - Fiches synthétiques 1 page par département en fin de document.
# ========================================================================================

version: 1
gabarit_id: pnf_v2
label: "PNF v2"
description: "Gabarit de présentation Bilan PNF (AOA, Cœur de parc, avec focus 21 & 52)"

cible: les_deux
profils_compatibles:
  - pnf
  - pnf_v2

title:
  line1: "Bilan des activités de police\nde l'environnement de l'OFB"
  line2_mode: fixed
  line2_fixed: "Parc National de Forêts"
  line3_mode: none

sections:
  order:
    - sec1
    - sec2
    - sec21
    - sec22
    - sec23
    - sec4
    - sec41
    - sec42
    - sec43
    - sec44
    - sec3
    - sec31
    - sec32
    - sec33
    - sec5
    - sec6
  perimetres:
    aoa: "Synthèse globale Aire Optimale d'Adhésion (AOA)"
    coeur: "Focus dédié Cœur de Parc National"
    departements: "Fiches synthétiques territoriales (Côte-d'Or & Haute-Marne)"

cartographie:
  items_masques_brochure:
    - titre_principal
    - sous_titre
    - bandeau_titre
    - bandeau_logos_ofb
    - logo_ofb_bas_droite
    - bandeau_source

layout_grid:
  type: grid
  pages:
    - page_number: 1
      rows:
        - columns:
            - width: "100%"
              widget:
                type: stat_kpi_grid
        - columns:
            - width: "55%"
              widget:
                type: map
            - width: "45%"
              widget:
                type: section_group
                sections: [sec1, sec2]
    - page_number: 2
      rows:
        - columns:
            - width: "50%"
              widget:
                type: theme_breakdown_table
            - width: "50%"
              widget:
                type: evolution_chart

fiches_departementales:
  page_break_before: true
  strict_a4_single_page: true

sections_enrichies:
  synthese_regionale:
    afficher_donut_usagers: false
    legend_fontsize_donut: 9.0
    carte_choroplethe:
      width_ratio: 0.95
      max_h: 290.0
      max_span_factor: 0.51
      cbar_shrink: 0.35
      cbar_title_fontsize: 7.0
      cbar_labelsize: 6.0
    palette:
      fond_carte: '#ffffff'
      zero_color: '#f1f5f9'
      commune_edgecolor: '#cbd5e1'
      dept_edgecolor: '#003366'
      dept_highlight_fill: '#bfdbfe'
      coeur_parc_edgecolor: '#16a34a'
      note_color: '#64748b'
      sous_titre_texte: '#555555'
      ligne_tableau_entete: '#003366'
      ligne_tableau_corps: '#e2e8f0'
      commentaire_texte: '#222222'
    styles:
      title_fontsize: 8.5
      note_fontsize: 5.5
      mini_map_cbar_fontsize: 6.5
      mini_map_fallback_fontsize: 8.0
  brochure:
    palette:
      texte_principal: '#1F2937'
      texte_secondaire: '#4B5563'
      texte_legende: '#6B7280'
      titre_accent: '#003366'
      encadre_fond: '#F3F4F6'
      encadre_bordure: '#D1D5DB'
      total_fond: '#E8EEF4'
      pastille_texte_bordure: '#1E293B'
      pastille_conforme: '#70C157'
      pastille_manquement: '#8B5CF6'
      pastille_infraction: '#EF4444'
      badge_sous_titre: '#475569'
      badge_fond: '#E2E8F0'
      badge_valeur: '#0284C7'
      histo_pa: '#0284C7'
      histo_pej: '#D97706'
      histo_pve: '#16A34A'
    styles:
      pve_table_font_size: 7.2
      procedures_table_font_size: 7.5
      hierarchie_cat_font_size: 7.2
      hierarchie_sub_font_size: 6.8
      placeholder_font_size: 8.5
      pastille_title_font_size: 10.0
      pastille_pct_font_size: 10.0
      pastille_label_font_size: 7.5
      badge_title_font_size: 9.5
      badge_subtitle_font_size: 7.5
      badge_value_font_size: 17.0
      badge_label_font_size: 7.0
      evolution_title_font_size: 9.0
      evolution_axis_font_size: 8.0
      evolution_legend_font_size: 7.0

