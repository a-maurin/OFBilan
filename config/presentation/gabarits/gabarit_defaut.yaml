# ========================================================================================
# GABARIT DE PRESENTATION : INSTITUTIONNEL PAR DEFAUT (`gabarit_defaut.yaml`)
# ========================================================================================
#
# RÔLE : Gabarit de PRÉSENTATION uniquement (mise en page, ordre des sections, titres visuels).
# → Ce fichier ne contient AUCUNE logique métier (filtres, sources de données, périmètre géo).
# → Pour la logique métier, voir : config/profils_bilan/<profil>.yaml
#
# Relation Profil / Gabarit :
#   - Le PROFIL définit QUOI analyser : périmètre géo, sources, agrégations, options métier.
#   - Le GABARIT définit COMMENT présenter : grille de pages, widgets, ordre des chapitres.
#   - Un même gabarit peut s'appliquer à plusieurs profils (voir `profils_compatibles`).
#   - Un même profil peut être rendu avec différents gabarits selon le destinataire.
#
# Explication des clés :
#   - `gabarit_id` : identifiant unique du gabarit (répertorié dans les menus Web/CLI).
#   - `layout_grid.pages` : grille déclarative de widgets répartis sur 2 pages.
#   - `cible` : `les_deux` (s'applique aussi bien au bilan PDF qu'à la brochure PDF).
#   - `sections.order` : ordre d'enchaînement des chapitres dans le document.
# ========================================================================================

version: 1
gabarit_id: gabarit_defaut
label: "Gabarit institutionnel par défaut"
description: "Gabarit de présentation synthétique institutionnelle par défaut de l'OFB"

cible: les_deux

title:
  line2_mode: auto

cartographie:
  items_masques_brochure:
    - titre_principal
    - sous_titre
    - bandeau_titre
    - bandeau_logos_ofb
    - logo_ofb_bas_droite
    - bandeau_source

layout_grid:
  type: grid
  pages:
    - page_number: 1
      rows:
        - columns:
            - width: "100%"
              widget:
                type: stat_kpi_grid
        - columns:
            - width: "50%"
              widget:
                type: carte_choroplethe
            - width: "50%"
              widget:
                type: theme_breakdown_table
    - page_number: 2
      rows:
        - columns:
            - width: "50%"
              widget:
                type: section_group
                sections: [sec1, sec2]
            - width: "50%"
              widget:
                type: evolution_chart

sections_enrichies:
  synthese_regionale:
    carte_choroplethe:
      titre: "Carte de la pression de contrôle par commune"
      indicateur: "pression_controle_communes"
      maille: "commune"
      sources: ["PA", "PEJ", "PVe"]
      colormap: "YlGnBu"
      zero_color: "#f1f5f9"
      commune_edgecolor: "#cbd5e1"
      dept_edgecolor: "#003366"
      afficher_etiquettes_communes: false
      max_h: 260.0
      width_ratio: 0.95
      cbar_title: "Pression de contrôle (localisations/commune)"
      afficher_note_hors_communes: true
    palette:
      fond_carte: '#ffffff'
      zero_color: '#f1f5f9'
      commune_edgecolor: '#cbd5e1'
      dept_edgecolor: '#003366'
      dept_highlight_fill: '#bfdbfe'
      coeur_parc_edgecolor: '#16a34a'
      note_color: '#64748b'
      sous_titre_texte: '#555555'
      ligne_tableau_entete: '#003366'
      ligne_tableau_corps: '#e2e8f0'
      commentaire_texte: '#222222'
    styles:
      title_fontsize: 8.5
      note_fontsize: 5.5
      mini_map_cbar_fontsize: 6.5
      mini_map_fallback_fontsize: 8.0
  brochure:
    page2_colonnes_ratio: 0.50
    pve_table_colonnes: "natinf_detail"
    libelle_total_repressif: "Total"
    libelle_total_pve: "Total PVe"
    palette:
      texte_principal: '#1F2937'
      texte_secondaire: '#4B5563'
      texte_legende: '#6B7280'
      titre_accent: '#003366'
      encadre_fond: '#F3F4F6'
      encadre_bordure: '#D1D5DB'
      total_fond: '#E8EEF4'
      pastille_texte_bordure: '#1E293B'
      pastille_conforme: '#70C157'
      pastille_manquement: '#8B5CF6'
      pastille_infraction: '#EF4444'
      badge_sous_titre: '#475569'
      badge_fond: '#E2E8F0'
      badge_valeur: '#0284C7'
      histo_pa: '#0284C7'
      histo_pej: '#D97706'
      histo_pve: '#16A34A'
    styles:
      pve_table_font_size: 7.2
      procedures_table_font_size: 7.5
      hierarchie_cat_font_size: 7.2
      hierarchie_sub_font_size: 6.8
      placeholder_font_size: 8.5
      pastille_title_font_size: 10.0
      pastille_pct_font_size: 10.0
      pastille_label_font_size: 7.5
      badge_title_font_size: 9.5
      badge_subtitle_font_size: 7.5
      badge_value_font_size: 17.0
      badge_label_font_size: 7.0
      evolution_title_font_size: 9.0
      evolution_axis_font_size: 8.0
      evolution_legend_font_size: 7.0


