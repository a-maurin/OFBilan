# ========================================================================================
# GABARIT DE PRESENTATION : INSTITUTIONNEL PAR DEFAUT (`gabarit_defaut.yaml`)
# ========================================================================================
#
# RÔLE : Gabarit de PRÉSENTATION uniquement (mise en page, ordre des sections, titres visuels).
# → Ce fichier ne contient AUCUNE logique métier (filtres, sources de données, périmètre géo).
# → Pour la logique métier, voir : config/profils_bilan/<profil>.yaml
#
# Relation Profil / Gabarit :
#   - Le PROFIL définit QUOI analyser : périmètre géo, sources, agrégations, options métier.
#   - Le GABARIT définit COMMENT présenter : grille de pages, widgets, ordre des chapitres.
#   - Un même gabarit peut s'appliquer à plusieurs profils (voir `profils_compatibles`).
#   - Un même profil peut être rendu avec différents gabarits selon le destinataire.
#
# Explication des clés :
#   - `gabarit_id` : identifiant unique du gabarit (répertorié dans les menus Web/CLI).
#   - `layout_grid.pages` : grille déclarative de widgets répartis sur 2 pages.
#   - `cible` : `les_deux` (s'applique aussi bien au bilan PDF qu'à la brochure PDF).
#   - `sections.order` : ordre d'enchaînement des chapitres dans le document.
# ========================================================================================

version: 1
gabarit_id: gabarit_defaut
label: "Gabarit institutionnel par défaut"
description: "Gabarit de présentation synthétique institutionnelle par défaut de l'OFB"

cible: les_deux

title:
  line2_mode: auto

cartographie:
  items_masques_brochure:
    - titre_principal
    - sous_titre
    - bandeau_titre
    - bandeau_logos_ofb
    - logo_ofb_bas_droite
    - bandeau_source

layout_grid:
  type: grid
  pages:
    - page_number: 1
      rows:
        - columns:
            - width: "100%"
              widget:
                type: stat_kpi_grid
        - columns:
            - width: "50%"
              widget:
                type: carte_choroplethe
            - width: "50%"
              widget:
                type: theme_breakdown_table
    - page_number: 2
      rows:
        - columns:
            - width: "50%"
              widget:
                type: section_group
                sections: [sec1, sec2]
            - width: "50%"
              widget:
                type: evolution_chart

sections_enrichies:
  synthese_regionale:
    carte_choroplethe:
      titre: "Carte de la pression de contrôle par commune"
      indicateur: "pression_controle_communes"
      maille: "commune"
      sources: ["PA", "PEJ", "PVe"]
      colormap: "YlGnBu"
      zero_color: "#f1f5f9"
      commune_edgecolor: "#cbd5e1"
      dept_edgecolor: "#003366"
      afficher_etiquettes_communes: false
      max_h: 260.0
      width_ratio: 0.95
      cbar_title: "Pression de contrôle (localisations/commune)"
      afficher_note_hors_communes: true
  brochure:
    page2_colonnes_ratio: 0.50
    pve_table_colonnes: "natinf_detail"
    libelle_total_repressif: "Total"
    libelle_total_pve: "Total PVe"


