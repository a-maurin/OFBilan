# ========================================================================================
# GABARIT DE PRESENTATION : SERVICE REGIONAL POLICE BFC (`srp_r27.yaml`)
# ========================================================================================
#
# RÔLE : Gabarit de PRÉSENTATION uniquement (mise en page, ordre des sections, titres visuels).
# → Ce fichier ne contient AUCUNE logique métier (filtres, sources de données, périmètre géo).
# → La logique métier (région, service) est portée par les données à l'exécution
#   et non par un fichier profil dédié (ce gabarit s'applique à tous profils de la région R27).
#
# Relation Profil / Gabarit :
#   - Le PROFIL définit QUOI analyser : périmètre géo, sources, agrégations, options métier.
#   - Le GABARIT définit COMMENT présenter : grille de pages, widgets, ordre des chapitres.
#   - Ce gabarit cible les deux formats (bilan et brochure) pour la région BFC / SRP.
#
# Spécificités de ce gabarit :
#   - `organisation.code_region` / `organisation.service` : métadonnées de ciblage institutionnel.
#   - `title.line2_fixed` : sous-titre fixe "Service Régional Police – BFC".
#   - `sections.order` : ordre personnalisé d'enchaînement des chapitres.
#   - `layout_grid` : grille 2 pages sur-mesure (KPI + carte + sections + tableau thématique).
# ========================================================================================

version: 1
gabarit_id: srp_r27
label: "R27 - Service Régional Police (BFC)"
description: "Gabarit de présentation avec mise en page brochure condensée pour le SRP Bourgogne-Franche-Comté"

cible: les_deux
layout_mode: brochure_custom
organisation:
  code_region: r27
  service: srp

title:
  line2_mode: fixed
  line2_fixed: "Service Régional Police – BFC"

sections:
  order:
    - sec1
    - sec2
    - sec4
    - sec3
    - sec6

cartographie:
  items_masques:
    - titre_principal
    - sous_titre
    - bandeau_titre
    - bandeau_logos_ofb
    - logo_ofb_bas_droite
    - bandeau_source
  items_masques_brochure:
    - titre_principal
    - sous_titre
    - bandeau_titre
    - bandeau_logos_ofb
    - logo_ofb_bas_droite
    - bandeau_source

layout_grid:
  type: grid
  pages:
    - page_number: 1
      rows:
        - columns:
            - width: "100%"
              widget:
                type: stat_kpi_grid
        - columns:
            - width: "50%"
              widget:
                type: map
            - width: "50%"
              widget:
                type: section_group
                sections: [sec1, sec2, sec4]
    - page_number: 2
      rows:
        - columns:
            - width: "50%"
              widget:
                type: theme_breakdown_table
            - width: "50%"
              widget:
                type: section_group
                sections: [sec3, sec6]

sections_enrichies:
  synthese_regionale:
    afficher_donut_usagers: true
    palette:
      fond_carte: '#ffffff'
      zero_color: '#f1f5f9'
      commune_edgecolor: '#cbd5e1'
      dept_edgecolor: '#003366'
      dept_highlight_fill: '#bfdbfe'
      coeur_parc_edgecolor: '#16a34a'
      note_color: '#64748b'
      sous_titre_texte: '#555555'
      ligne_tableau_entete: '#003366'
      ligne_tableau_corps: '#e2e8f0'
      commentaire_texte: '#222222'
    styles:
      title_fontsize: 8.5
      note_fontsize: 5.5
      mini_map_cbar_fontsize: 6.5
      mini_map_fallback_fontsize: 8.0
  brochure:
    palette:
      texte_principal: '#1F2937'
      texte_secondaire: '#4B5563'
      texte_legende: '#6B7280'
      titre_accent: '#003366'
      encadre_fond: '#F3F4F6'
      encadre_bordure: '#D1D5DB'
      total_fond: '#E8EEF4'
      pastille_texte_bordure: '#1E293B'
      pastille_conforme: '#70C157'
      pastille_manquement: '#8B5CF6'
      pastille_infraction: '#EF4444'
      badge_sous_titre: '#475569'
      badge_fond: '#E2E8F0'
      badge_valeur: '#0284C7'
      histo_pa: '#0284C7'
      histo_pej: '#D97706'
      histo_pve: '#16A34A'
    styles:
      pve_table_font_size: 7.2
      procedures_table_font_size: 7.5
      hierarchie_cat_font_size: 7.2
      hierarchie_sub_font_size: 6.8
      placeholder_font_size: 8.5
      pastille_title_font_size: 10.0
      pastille_pct_font_size: 10.0
      pastille_label_font_size: 7.5
      badge_title_font_size: 9.5
      badge_subtitle_font_size: 7.5
      badge_value_font_size: 17.0
      badge_label_font_size: 7.0
      evolution_title_font_size: 9.0
      evolution_axis_font_size: 8.0
      evolution_legend_font_size: 7.0
  saisonnalite:
    enabled: true
    title: "1.3 Saisonnalité mensuelle de l'activité"

  top_infractions:
    enabled: true
    title: "1.4 Principales infractions relevées (Top 5 PEJ & Top 5 PVe)"
    limit_pej: 5
    limit_pve: 5
  fiches_departementales:
    page_unique_stricte: true
    afficher_taux_non_conformite: true
    afficher_maillage_communes: false
    visuel_droite: usagers
    tableau_synthese: theme_snc
    limit_themes_snc: 10


