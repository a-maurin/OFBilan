# Profil thématique PNF : activité du service à l'intérieur du parc — structure classique (sec1-sec6)
schema_version: 2
id: pnf
label: "PNF"
title_label: "Parc national de forêts"
pipeline: global
presentation_scope: global
out_subdir: bilan_pnf

# Restreindre l'analyse à toutes les communes du périmètre du parc
# (aire d'adhésion + cœur), selon le référentiel PNF chargé par load_pnf.
restrict_geo: pnf

# Départements couverts par ce profil (utilisé pour le titre des fiches et les agrégations)
departements: ["21", "52"]

filter:
  type: all

natinf_pve: []
natinf_pej: []

analyse_PVe: true

sources:
  point_ctrl: true
  pej: true
  pa: true
  pve: true

periode_analyse:
  ventilation:
    type: auto
    seuil_jours: 366

analyses:
  distinction_coeur_hors_coeur: true

aggregation:
  adapter: run_profile_aggregations

pdf:
  adapter: generate_profile_pdf_report

options:
  pnf:
    label: "Analyse PNF (ensemble + cœur)"
    default: true
    ask: false
  tub:
    label: "Analyse zones TUB"
    default: false
    ask: false
  cartes:
    label: "Intégration des cartes"
    default: true
    ask: false
  par_commune:
    label: "Indicateurs par commune"
    default: true
    ask: false
  agent_service:
    label: "Organisme / Service"
    default: "tous"

agent_rules:
  pnf_keywords: ["PNF", "P.N.F", "PARC", "FORETS", "FORET", "FORÊTS", "FORÊT"]
  ofb_keywords: ["OFB", "SD", "BRIGADE"]

cartographie:
  mode: dedie
  cartes_actives:
    - domaines
    - usagers
    - resultats
    - procedures
  fichiers:
    - carte_pnf_domaines.png
    - carte_pnf_usagers.png
    - carte_pnf_resultats.png
    - carte_pnf_procedures.png
  pochoir: aoa
  emprise: aoa
  couches_vecteurs_extra:
    - coeur_parc
