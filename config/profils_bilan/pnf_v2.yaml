# ========================================================================================
# PROFIL DE BILAN THEMATHIQUE PNF V2 (`pnf_v2.yaml`)
# ========================================================================================
# Ce fichier définit le profil de bilan Parc national de forêts V2 qui applique la structure
# et les adaptateurs des bilans régionaux (agrégations AOA, Cœur de parc, Côte-d'Or 21 & Haute-Marne 52).
# ========================================================================================

schema_version: 2
id: pnf_v2
label: "Parc national de forêts v2"
title_label: "Parc National de Forêts"
masquer_explorateur: true
pipeline: global
presentation_scope: global
gabarit: pnf_v2
out_subdir: bilan_pnf_v2
output_filename: bilan_pnf_v2.pdf

restrict_geo: pnf

# Départements couverts par ce profil (utilisé pour le titre des fiches et les agrégations)
departements: ["21", "52"]

filter:
  type: all

natinf_pve: []
natinf_pej: []

analyse_PVe: true

sources:
  point_ctrl: true
  pej: true
  pa: true
  pve: true

periode_analyse:
  ventilation:
    type: auto
    seuil_jours: 366

analyses:
  type_usager: true
  distinction_coeur_hors_coeur: true

aggregation:
  adapter: run_profile_aggregations

pdf:
  adapter: generate_profile_pdf_report

capabilities:
  combine: false
  mix_batch: false
  map_profiles:
    - pnf_domaines
    - pnf_usagers
    - pnf_resultats
    - pnf_procedures

cartographie:
  mode: dedie
  cartes_actives:
    - domaines
    - usagers
    - resultats
    - procedures
  fichiers:
    - carte_pnf_domaines.png
    - carte_pnf_usagers.png
    - carte_pnf_resultats.png
    - carte_pnf_procedures.png
  pochoir: aoa
  emprise: aoa
  couches_vecteurs_extra:
    - coeur_parc
  show_coeur_parc: true
  carte_coeur_parc_dediee: true

options:
  pnf:
    label: "Analyse PNF (ensemble + cœur)"
    default: true
    ask: false
  tub:
    label: "Analyse zones TUB"
    default: false
    ask: false
  cartes:
    label: "Intégration des cartes"
    default: true
    ask: false
  par_commune:
    label: "Indicateurs par commune"
    default: true
    ask: false
  agent_service:
    label: "Organisme / Service"
    default: "tous"

agent_rules:
  pnf_keywords: ["PNF", "P.N.F", "PARC", "FORETS", "FORET", "FORÊTS", "FORÊT"]
  ofb_keywords: ["OFB", "SD", "BRIGADE"]

mapping_pnf:
  charte_themes:
    foret: ["Forêt", "Coupe", "Défrichisme", "Boisement"]
    biodiversite: ["Nature", "Faune", "Flore", "Espèces protégées", "Chasse"]
    eau: ["Eau", "Milieu aquatique", "Zone humide", "Pollution"]
    circulation: ["Circulation", "VTM", "Voie", "Chemin"]
  usagers_cibles:
    professionnels: ["Professionnel", "Exploitant forestier", "Entreprise", "Artisan"]
    chasseurs: ["Chasseur", "Gestionnaire cynégétique", "Société de chasse"]
    promeneurs: ["Promeneur", "Particulier", "Randonneur", "Public"]
    petitionnaires: ["Pétitionnaire", "Aménageur", "Propriétaire"]

