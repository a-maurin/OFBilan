# ========================================================================================
# PROFIL DE BILAN GLOBAL (`global.yaml`)
# ========================================================================================
# Ce fichier définit la configuration du rapport principal "Bilan Global" qui agrège l'ensemble
# des données de police environnementale (tous domaines et thématiques confondus).
#
# Clés et fonctionnalités pour les non-spécialistes :
#   - `id` / `pipeline` : identifiant unique ("global") exécutant le pipeline complet d'agrégation.
#   - `capabilities` : `combine: false` et `mix_batch: false` car le bilan global est autonome.
#   - `cartographie.catalog` : définit les 4 cartes thématiques générées (Domaines, Contrôles, Usagers, Procédures).
#   - `periode_analyse.ventilation` : ventilation temporelle automatique (`auto`) selon la durée choisie.
#   - `options.cartes_selection` : permet à l'utilisateur de cocher les cartes à inclure dans le PDF.
# ========================================================================================

id: global
label: Bilan global
title_label: Bilan global
pipeline: global
presentation_scope: global
out_subdir: bilan_global
output_filename: bilan_global.pdf
capabilities:
  combine: false
  mix_batch: false
  map_profiles: []

cartographie:
  catalog:
    - id: global_domaines
      label: "Domaines"
      fichier: carte_global_domaines.png
    - id: global_resultats
      label: "Contrôles"
      fichier: carte_global_resultats.png
    - id: global_usagers
      label: "Types d'usagers"
      fichier: carte_global_usagers.png
    - id: global_procedures
      label: "Procédures"
      fichier: carte_global_procedures.png

aggregation:
  adapter: run_profile_aggregations
pdf:
  adapter: generate_profile_pdf_report
periode_analyse:
  ventilation:
    type: auto
    seuil_jours: 0
analyse_PVe: true
analyses:
  type_usager: true
  distinction_coeur_hors_coeur: false

options:
  cartes:
    label: "Intégration des cartes"
    default: true
    ask: false
  cartes_selection:
    label: "Cartes à intégrer au PDF"
    type: multi_choice
    default:
      - global_domaines
      - global_resultats
      - global_usagers
      - global_procedures
    ask: true
