# ========================================================================================
# PROFIL DE BILAN THEMATHIQUE : AGRAINAGE (`agrainage.yaml`)
# ========================================================================================
# Ce fichier régit le filtrage et la génération du rapport PDF thématique "Contrôles agrainage".
#
# Clés et règles de filtrage pour les non-spécialistes :
#   - `keywords` : mot-clé recherché ("agrain") dans le nom des fiches de contrôle.
#   - `exclude_patterns` : exclusion des contrôles Tuberculose bovine, Grippe aviaire ou Piégeage.
#   - `natinf_pve` / `natinf_pej` : codes d'infractions NATINF ciblés (ex: 27742 - agrainage non conforme).
#   - `analyses.zone_lecteur_4_zones` : active la ventilation géographique entre Coeur de Parc PNF,
#     Aire d'Adhésion, Zone TUB et Hors périmètres.
# ========================================================================================

# Profil bilan agrainage
schema_version: 2
id: agrainage
label: "Contrôles agrainage"
out_subdir: bilan_agrainage

filter:
  type: agrainage
  keywords: ["agrain"]
  columns: [nom_dossie, type_actio]
  exclude_patterns: ["tubercul", "grippe", "pi[eé]geage"]

natinf_pve: ["27742", "25001"]
natinf_pej: ["27742", "25001"]

analyse_PVe: true

sources:
  point_ctrl: true
  pej: true
  pa: true
  pve: true

periode_analyse:
  ventilation:
    type: auto
    seuil_jours: 366

# Colonne Zone PDF : Coeur de parc, Aire d'adhésion, Zone TUB, Hors PNF/TUB
analyses:
  zone_lecteur_4_zones: true

options:
  pnf:
    label: "Analyse PNF / hors PNF"
    default: false
    ask: true
  tub:
    label: "Analyse zones TUB"
    default: true
    ask: true
  cartes:
    label: "Intégration des cartes"
    default: true
    ask: false
  par_commune:
    label: "Indicateurs par commune"
    default: true
    ask: false
  synthese_croisee:
    label: "Synthèse croisée par zone (Ctrl × PVe × PEJ)"
    default: true
    ask: true

cartographie:
  cartes_actives:
    - resultats
    - procedures
  couches_vecteurs_extra:
    - zone_tub
    - coeur_parc
    - aoa
