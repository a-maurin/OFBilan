# ========================================================================================
# VALEURS PAR DEFAUT DES PROFILS DE BILAN (`_defaults.yaml`)
# ========================================================================================
# Ce fichier définit le socle de configuration par défaut hérité par tous les profils YAML
# de bilan (`agrainage.yaml`, `chasse.yaml`, `global.yaml`, `piegeage.yaml`, etc.).
#
# Rôles des blocs pour les non-spécialistes :
#   - `pipeline` / `presentation_scope` : mode d'analyse par défaut (`thematic` ou `global`).
#   - `aggregation` / `pdf` : adaptateurs système responsables des calculs et du rendu PDF.
#   - `capabilities` : autorise le mixage en lot (`mix_batch`) ou la fusion combinée (`combine`).
#   - `cartographie` : liste des cartes actives par défaut, type d'emprise et textes de cartouche.
#   - `options` : paramètres interactifs utilisateur (ex: activation de l'analyse PNF).
# ========================================================================================

schema_version: 2
version: 1.0.0
date_modification: "2026-08-13"
pipeline: thematic
presentation_scope: thematique
aggregation:
  adapter: run_profile_aggregations
  thematic_adapter: run_thematic_aggregations
pdf:
  adapter: generate_profile_pdf_report
  thematic_adapter: generate_thematic_pdf_report
capabilities:
  combine: true
  mix_batch: true
cartographie:
  cartes_actives:
    - domaines
    - usagers
    - resultats
    - procedures
  emprise: departement
  pochoir: departement
  couches_vecteurs_extra: []
  extra_texts:
    texte_bandeau_haut: "{nom_bilan} — {periode_formatee}"
    texte_bandeau_bas: "Sources : OFB/OSCEAN – MININT/AGC – OpenStreetMap\nRéalisation : OFB SD{departement} – {date_fin} | Projection : RGF93 / Lambert-93 (EPSG:2154)"
options:
  pnf:
    label: Analyse PNF (cœur / hors-cœur et zonage parc)
    default: false
    ask: true
